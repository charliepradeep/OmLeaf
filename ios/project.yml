name: OmLeaf
options:
  bundleIdPrefix: com.charrlie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  OmLeaf:
    type: application
    platform: iOS
    sources:
      - path: OmLeaf
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charrlie.omleaf
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OmLeaf/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Set your team here (or in Xcode: Signing & Capabilities)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  OmLeafTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OmLeafTests
    dependencies:
      - target: OmLeaf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charrlie.omleaf.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OmLeaf:
    build:
      targets:
        OmLeaf: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OmLeafTests
